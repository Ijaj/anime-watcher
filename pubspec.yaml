name: anime_watcher
description: Anime Watcher Helper Software
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_acrylic: ^1.1.4
  window_manager: ^0.5.2
  sqflite: ^2.4.4
  file_picker: ^13.1.0
  dio: ^5.11.1

  path_provider: ^2.1.6
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  sqflite_common: ^2.5.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/
    - assets/purple_dark.json
  uses-material-design: true

