name: Release builds

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Download VC++ runtime redistributable
        run: curl.exe -fL -o packaging\windows\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "${{ github.ref_name }}") { $version = "0.0.0-dev" }
          $env:ANIME_WATCHER_VERSION = $version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: anime-watcher-setup_x64
          path: dist/anime-watcher-setup_x64.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anime-watcher-setup_x64.exe

  linux-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsqlite3-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="0.0.0-dev"
          stage="anime-watcher-linux-x64-v${version}"
          mkdir -p "dist/$stage"
          cp -r build/linux/x64/release/bundle "dist/$stage/bundle"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/anime-watcher.desktop "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
          rm -rf "dist/$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: anime-watcher-linux-x64
          path: dist/*.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
